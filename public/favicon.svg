<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft drop shadow for a premium 3D lift -->
    <filter id="luxury-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    
    <!-- Multi-stop luxury metallic gold gradient -->
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#795b1e" />
      <stop offset="20%" stop-color="#c5a04f" />
      <stop offset="40%" stop-color="#fdf0cd" />
      <stop offset="60%" stop-color="#d4af37" />
      <stop offset="80%" stop-color="#f5e1a4" />
      <stop offset="100%" stop-color="#93712b" />
    </linearGradient>

    <!-- Deep dark background gradient for high contrast -->
    <radialGradient id="dark-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151515" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
  </defs>

  <!-- Background circle for high-contrast on browser tabs -->
  <circle cx="256" cy="256" r="240" fill="url(#dark-bg)" stroke="url(#gold)" stroke-width="3"/>
  
  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#gold)" stroke-width="4" filter="url(#luxury-shadow)"/>
  <!-- Inner beaded ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="5,6" opacity="0.7"/>

  <!-- Monogram Group -->
  <g filter="url(#luxury-shadow)">
    <!-- The 'T' Top Bar with elegant serifs -->
    <path d="M 160 155 C 160 155, 165 140, 182 140 L 330 140 C 347 140, 352 155, 352 155 L 348 158 C 348 158, 340 150, 323 150 L 189 150 C 172 150, 164 158, 164 158 Z" fill="url(#gold)"/>
    
    <!-- The 'T' Vertical Stem -->
    <path d="M 251 150 L 261 150 L 261 350 C 261 350, 269 350, 274 355 L 274 358 L 238 358 L 238 355 C 243 350, 251 350, 251 350 Z" fill="url(#gold)"/>
    
    <!-- The 'A' Left Leg (thin, delicate line with base serif) -->
    <path d="M 256 150 L 175 350 C 175 350, 160 350, 150 355 L 150 358 L 195 358 L 195 355 C 185 350, 183 350, 190 332 L 212 275 L 256 170 Z" fill="url(#gold)"/>

    <!-- The 'A' Right Leg (thick, bold, elegant line with base serif) -->
    <path d="M 256 150 L 235 200 L 285 320 C 295 345, 300 350, 315 350 L 315 355 L 350 355 L 350 350 C 340 350, 335 345, 325 320 L 256 170 Z" fill="url(#gold)"/>
    
    <!-- The 'A' Crossbar (thin elegant ribbon curved upwards) -->
    <path d="M 201 285 Q 256 272 311 285 Q 256 290 201 285" fill="url(#gold)"/>

    <!-- Luxury Diamond Sparkle at the top center -->
    <path d="M 256 80 L 260 92 L 272 96 L 260 100 L 256 112 L 252 100 L 240 96 L 252 92 Z" fill="url(#gold)"/>
    
    <!-- Left Small Sparkle -->
    <path d="M 120 230 L 122 236 L 128 238 L 122 240 L 120 246 L 118 240 L 112 238 L 118 236 Z" fill="url(#gold)" opacity="0.8"/>
    
    <!-- Right Small Sparkle -->
    <path d="M 392 230 L 394 236 L 400 238 L 394 240 L 392 246 L 390 240 L 384 238 L 390 236 Z" fill="url(#gold)" opacity="0.8"/>
  </g>
</svg>
