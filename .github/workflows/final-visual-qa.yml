name: final visual QA

on:
  push:
    branches:
      - main
      - 'qa/**'
      - 'redesign/**'
      - 'fix/**'
    paths:
      - '*.html'
      - 'style.css'
      - 'campaign-v7.css'
      - 'atelier-v11.css'
      - 'atelier-v11-fixes.css'
      - 'main.js'
      - 'src/**'
      - 'assets/**'
      - 'scripts/final-visual-qa.mjs'
      - 'scripts/v11-commerce-layout-regression.mjs'
      - 'scripts/portrait-media-regression.mjs'
      - 'scripts/pdp-sticky-regression.mjs'
      - 'scripts/mobile-menu-regression.mjs'
      - '.github/workflows/final-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/atelier-server.log 2>&1 &
          echo $! > /tmp/atelier-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/atelier-server.log
          exit 1

      - name: Capture representative UI
        run: |
          node scripts/final-visual-qa.mjs
          node scripts/v11-commerce-layout-regression.mjs
          node scripts/portrait-media-regression.mjs
          node scripts/pdp-sticky-regression.mjs
          node scripts/mobile-menu-regression.mjs
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-artifacts

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-final-visual-qa
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 14
