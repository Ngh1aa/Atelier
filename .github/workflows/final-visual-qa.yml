name: final visual QA

on:
  push:
    branches:
      - main
      - 'qa/**'
      - 'redesign/**'
      - 'fix/**'
    paths:
      - '*.html'
      - 'style.css'
      - 'campaign-v7.css'
      - 'atelier-v11.css'
      - 'atelier-v11-fixes.css'
      - 'atelier-v11-portrait.css'
      - 'atelier-v12.css'
      - 'atelier-v12-white.css'
      - 'atelier-v14.css'
      - 'atelier-v14-site.css'
      - 'atelier-media-integrity.css'
      - 'main.js'
      - 'src/**'
      - 'assets/**'
      - 'scripts/final-visual-qa.mjs'
      - 'scripts/v11-commerce-layout-regression.mjs'
      - 'scripts/portrait-media-regression.mjs'
      - 'scripts/catalogue-crop-regression.mjs'
      - 'scripts/v12-youth-luxury-regression.mjs'
      - 'scripts/v12-monochrome-regression.mjs'
      - 'scripts/pdp-sticky-regression.mjs'
      - 'scripts/mobile-menu-regression.mjs'
      - 'scripts/v14-whole-site-qa.mjs'
      - 'scripts/v14-visual-sanity-regression.mjs'
      - 'scripts/v15-elementary-visual-integrity.mjs'
      - 'scripts/v15-targeted-evidence.mjs'
      - '.github/workflows/final-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Project tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/atelier-server.log 2>&1 &
          echo $! > /tmp/atelier-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/atelier-server.log
          exit 1

      - name: Capture representative UI
        run: |
          if [ -f atelier-v14-site.css ] && [ -f scripts/v14-whole-site-qa.mjs ]; then
            echo "V14 desktop-only contract detected; mobile/tablet regression is N/A_JUSTIFIED."
            QA_OUT_DIR=qa-artifacts/v14-whole-site node scripts/v14-whole-site-qa.mjs
            QA_OUT_DIR=qa-artifacts/v14-sanity node scripts/v14-visual-sanity-regression.mjs
            QA_OUT_DIR=qa-artifacts/v15-elementary-integrity node scripts/v15-elementary-visual-integrity.mjs
            QA_OUT_DIR=qa-artifacts/v15-targeted-evidence node scripts/v15-targeted-evidence.mjs
          else
            node scripts/final-visual-qa.mjs
            node scripts/v11-commerce-layout-regression.mjs
            node scripts/portrait-media-regression.mjs
            node scripts/catalogue-crop-regression.mjs
            node scripts/v12-youth-luxury-regression.mjs
            node scripts/v12-monochrome-regression.mjs
            node scripts/pdp-sticky-regression.mjs
            node scripts/mobile-menu-regression.mjs
          fi
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-artifacts

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-final-visual-qa
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 14
