name: Senior Commerce State Coverage

on:
  pull_request:
    paths:
      - "detailproduct.html"
      - "cart.html"
      - "checkout.html"
      - "recruiter-state-lab.html"
      - "uiux-state-coverage.json"
      - "main.js"
      - "src/js/**"
      - "atelier-v16-senior-commerce.css"
      - ".github/workflows/state-lab-render-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-evidence:
    uses: Ngh1aa/uiux-ai-workspace/.github/workflows/external-agent-runner.yml@main
    with:
      target_repository: Ngh1aa/Atelier
      target_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      task: "Verify ATELIER V16 senior-commerce decision quality, recoverable Bag actions, truthful inventory and payment boundaries, delivery-date clarity, lifecycle states and responsive semantic evidence."
      authority: read_only
      qa_routes: "/detailproduct.html,/cart.html,/checkout.html,/recruiter-state-lab.html"
      acceptance: "Known inventory remains enforced and unknown stock remains unknown;destructive Bag removal is recoverable;delivery choices communicate arrival dates;checkout never claims live payment or fulfilment;Empty/Loading/Error/Sold-out lifecycle states pass desktop/tablet/mobile"
      state_contract: "uiux-state-coverage.json"
