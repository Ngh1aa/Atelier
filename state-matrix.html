<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>ATELIER — Commerce State Matrix</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f4f4f1;color:#111;font-family:Arial,Helvetica,sans-serif}body{padding:24px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px;border-bottom:1px solid #111;padding-bottom:14px}.head p{margin:0 0 7px;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#707070}.head h1{margin:0;font:400 30px/1 Georgia,"Times New Roman",serif;letter-spacing:-.025em}.head a{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:white;border:1px solid #cfcfcf;min-width:0}.tile-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #ddd;font-size:9px;text-transform:uppercase;letter-spacing:.09em}.tile-head strong{font-size:10px}.tile-head span{color:#777}.viewport{height:540px}.viewport iframe{display:block;width:100%;height:100%;border:0;background:#fff}@media(max-width:1000px){.grid{grid-template-columns:1fr}.viewport{height:620px}}@media(max-width:620px){body{padding:12px}.head{display:block}.head a{display:inline-block;margin-top:10px}.viewport{height:650px}}
  </style>
</head>
<body>
<header class="head"><div><p>Recruiter evidence / commerce lifecycle</p><h1>ATELIER state matrix</h1></div><a href="recruiter-state-lab.html?state=normal">Open interactive State Lab →</a></header>
<main class="grid">
  <section class="tile"><div class="tile-head"><strong>01 · Empty</strong><span>Bag / first-use</span></div><div class="viewport"><iframe data-state="empty" title="Atelier empty bag state" src="recruiter-state-lab.html?state=empty&pin=1&matrix=1"></iframe></div></section>
  <section class="tile"><div class="tile-head"><strong>02 · Loading</strong><span>High-resolution image</span></div><div class="viewport"><iframe data-state="loading" title="Atelier image loading state" src="recruiter-state-lab.html?state=loading&pin=1&matrix=1"></iframe></div></section>
  <section class="tile"><div class="tile-head"><strong>03 · Error</strong><span>Authorization declined</span></div><div class="viewport"><iframe data-state="error" title="Atelier payment error state" src="recruiter-state-lab.html?state=error&pin=1&matrix=1"></iframe></div></section>
  <section class="tile"><div class="tile-head"><strong>04 · Edge case</strong><span>Sold-out variants</span></div><div class="viewport"><iframe data-state="edge" title="Atelier sold-out variant state" src="recruiter-state-lab.html?state=edge&pin=1&matrix=1"></iframe></div></section>
</main>
<script>
  const focusState=(outer)=>{
    try{
      const lab=outer.contentDocument;
      const bar=lab.querySelector('.bar'); if(bar) bar.style.display='none';
      const note=lab.querySelector('.note'); if(note) note.style.display='none';
      const wrap=lab.querySelector('.wrap'); if(wrap) wrap.style.height='100%';
      const product=lab.querySelector('#frame');
      const state=outer.dataset.state;
      const focus=()=>{try{const target=product?.contentDocument?.querySelector(`[data-state-lab-marker="${state}"]`);if(target){target.scrollIntoView({block:'center'});product.contentWindow.scrollBy(0,-16)}}catch{}};
      product?.addEventListener('load',()=>setTimeout(focus,760),{once:true});
      setTimeout(focus,980);
    }catch{}
  };
  document.querySelectorAll('iframe[data-state]').forEach(frame=>frame.addEventListener('load',()=>focusState(frame)));
</script>
</body>
</html>
